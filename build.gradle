plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'info.solidsoft.pitest' version '1.19.0'
	id 'jacoco'
}

group = 'com.ldiamond'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'io.github.sashirestela:simple-openai:3.22.2'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	implementation 'org.apache.pdfbox:pdfbox-tools:3.0.8'

	implementation 'org.springframework.boot:spring-boot-starter'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = '0.8.13'
}

// Coverage report: build/reports/jacoco/test/html/index.html (generated after every `test` run)
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.register('integrationTest', Test) {
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter test
}

configurations.all {
	exclude module: 'spring-boot-starter-logging'
}

// Mutation testing: `./gradlew pitest`, report in build/reports/pitest/index.html
pitest {
	pitestVersion = '1.30.1'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['com.ldiamond.dli.*']
	excludedTestClasses = ['*IT']
	excludedGroups = ['integration']
	threads = Runtime.runtime.availableProcessors()
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}
