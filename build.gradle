plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ldiamond'
version = '0.1.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
    implementation 'io.github.sashirestela:simple-openai:3.17.2'
	implementation 'org.apache.pdfbox:pdfbox:3.0.4'
	implementation 'org.apache.pdfbox:pdfbox-tools:3.0.4'

	implementation 'org.springframework.boot:spring-boot-starter'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'com.github.javaparser:javaparser-parent:3.26.3'
	implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.26.3'
	implementation 'com.github.javaparser:javaparser-core:3.26.3'
	implementation 'com.github.javaparser:javaparser-core-serialization:3.26.3'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.ldiamond:architectureunittests:2.0.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

configurations {
    all*.exclude module : 'spring-boot-starter-logging'
}

jacoco {
    toolVersion = "0.8.12"
    reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = true
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}